{# The look of the console's public pages (Set up your app, Book a call): the website's colours #}
<style>
  :root { --pine:#1f4d3f; --pine-dark:#0e221c; --tape:#f2b705; --ink:#16231f; --muted:#56655f; --line:#d8ddd7; --bad:#b42318; --good:#1e7a4c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink);
         background: linear-gradient(160deg, var(--pine) 0%, var(--pine-dark) 70%); min-height: 100vh; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 28px 16px 48px; }
  .brand { color: #fff; font-weight: 800; font-size: 1.25rem; margin-bottom: 18px; display:flex; align-items:center; gap:8px; }
  .brand b { color: var(--tape); }
  .card { background: #fff; border-radius: 16px; padding: 24px 20px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  h1 { font-size: 1.4rem; margin: 0 0 6px; }
  p.lead { color: var(--muted); margin: 0 0 18px; }
  label { display:block; font-weight: 600; font-size: .92rem; margin: 14px 0 6px; }
  input[type=text], input[type=password] { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 1rem; }
  input:focus { outline: 2px solid var(--pine); border-color: var(--pine); }
  .addr { display:flex; align-items:center; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .addr input { border:0; border-radius:0; min-width: 0; }
  .addr span { padding: 0 12px; color: var(--muted); background: #f5f6f2; align-self: stretch; display:flex; align-items:center; white-space: nowrap; font-size:.9rem; }
  .hint { font-size: .82rem; color: var(--muted); margin-top: 6px; }
  .err { font-size: .85rem; color: var(--bad); margin-top: 6px; }
  .ok { font-size: .85rem; color: var(--good); margin-top: 6px; }
  .check { display:flex; gap:8px; align-items:flex-start; font-weight: 400; font-size:.9rem; }
  .check input { margin-top: 3px; }
  button, .btn { display:block; width:100%; margin-top: 20px; padding: 14px; border:0; border-radius: 12px; background: var(--pine); color:#fff;
           font-size: 1.05rem; font-weight: 700; cursor:pointer; text-align:center; text-decoration:none; }
  button[disabled] { opacity: .7; cursor: wait; }
  .formerr { background:#fdecea; color: var(--bad); border-radius: 10px; padding: 10px 12px; font-size:.9rem; margin-bottom: 8px; }
  .tick { font-size: 2.6rem; color: var(--good); }
  .addrbox { margin-top: 10px; padding: 10px 12px; background: #f1f6f3; border-radius: 10px; font-size: .9rem; color: var(--muted);
             overflow-wrap: anywhere; }
  .addrbox strong { color: var(--pine); }
  a { color: var(--pine); }
</style>
