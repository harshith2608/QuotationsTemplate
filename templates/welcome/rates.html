{% extends "welcome/_frame.html" %}
{% block step %}
<h4 class="fw-bold mb-1">Your rates</h4>
<p class="text-muted mb-4">Do you have an old quotation or your rate list in Excel ready?</p>
<form method="post" class="d-grid gap-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="btn btn-outline-primary btn-lg text-start p-3" type="submit" name="file" value="yes">
    <i class="bi bi-file-earmark-arrow-up me-2"></i><strong>Yes, upload it</strong>
    <span class="d-block small opacity-75 ms-4 ps-2">We read your items and rates from it. Customer names aren't kept.</span></button>
  <button class="btn btn-outline-primary btn-lg text-start p-3" type="submit" name="file" value="no">
    <i class="bi bi-list-check me-2"></i><strong>No, start with typical rates</strong>
    <span class="d-block small opacity-75 ms-4 ps-2">A ready list of common items. You change the rates to yours.</span></button>
</form>
{% if has_items %}
<div class="text-center mt-3 small"><a href="{{ url_for('welcome.check') }}">My rates are already in: check them</a></div>
{% endif %}
{% endblock %}
