# Render blueprint — one web service + one Postgres database per deployment.
# Rename the service/database for each client before deploying.
services:
  - type: web
    name: quotation-app
    runtime: python
    pythonVersion: "3.12.7"
    buildCommand: pip install -r requirements.txt
    # Apply migrations and create the first admin on every deploy (both are idempotent)
    startCommand: flask db upgrade && flask bootstrap && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: run.py
      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a secure value
      - key: DATABASE_URL
        fromDatabase:
          name: quotation-app-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false                # set in the Render dashboard
      - key: COMPANY_NAME
        sync: false
      - key: COMPANY_ADDRESS
        sync: false
      - key: COMPANY_PHONE
        sync: false
      - key: COMPANY_EMAIL
        sync: false
      - key: COMPANY_GSTIN
        sync: false
      - key: BRAND_PRIMARY
        sync: false
      - key: BRAND_ACCENT
        sync: false

databases:
  - name: quotation-app-db
    databaseName: quotation_app
    plan: free
